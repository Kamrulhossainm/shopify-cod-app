# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# Creates the web service (Docker) and a Postgres database.
services:
  - type: web
    name: cod-app
    runtime: docker
    plan: starter
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cod-app-db
          property: connectionString
      - key: SCOPES
        value: read_products,write_draft_orders,write_orders,write_order_edits,read_customers
      - key: PORT
        value: "3000"
      # Fill these in when Render asks (from Shopify Dev Dashboard -> your app -> Settings):
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      # Your Render URL, e.g. https://cod-app.onrender.com
      - key: SHOPIFY_APP_URL
        sync: false

databases:
  - name: cod-app-db
    plan: basic-256mb
    databaseName: cod_app
